name: CI/CD to Server

on:
  push:
    branches: [ master, dev, stage ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-backend

permissions:
  contents: read

# Production runs one at a time, from version selection through publication; a newer pending run
# replaces an older pending one (it contains its commits). Other branches are not serialized here.
concurrency:
  group: ${{ github.ref_name == 'master' && 'ok-service-backend-production' || format('ok-service-backend-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # reschedule: queue a run for the master tip after a superseded run
    if: github.ref_name == 'master' || github.ref_name == 'dev' || github.ref_name == 'stage'
    outputs:
      # master only: outdated | none | released | resume | new (see scripts/release-ci.sh)
      state: ${{ steps.release.outputs.state }}
      version: ${{ steps.release.outputs.version }}
      digest: ${{ steps.release.outputs.digest || steps.candidate.outputs.digest }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: ${{ github.ref_name == 'master' && '0' || '1' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Select production release (master)
        id: release
        if: github.ref_name == 'master'
        run: bash scripts/release-ci.sh select "$IMAGE_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # A retried old run may have displaced the pending run of the master tip; make sure the tip still runs.
      - name: Reschedule master tip (superseded run)
        if: steps.release.outputs.state == 'outdated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-ci.sh reschedule

      - name: Generate fake VAPID keys
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out vapid_private_key.pem
          openssl ec -in vapid_private_key.pem -pubout -out vapid_public_key.pem

      - name: Create test .env
        run: |
          echo "JWT_SECRET_KEY=testing_key" > .env.test
          echo "SECRET_KEY=another_test_key" >> .env.test
          echo "TEST_DATABASE_URL=postgresql://test:test@172.17.0.1:5432/test_db" >> .env.test

      - name: Build test image & run tests
        run: |
          docker buildx build \
            --target test \
            --cache-from=type=registry,ref=${{ env.IMAGE_NAME }}:buildcache \
            --cache-to=type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max \
            --load \
            -t ok-service-backend-test .

          # Release automation must run, not skip: missing git/jq fails here. -v -rs lists each test and any skip reason.
          docker run \
            --rm \
            --env-file .env.test \
            -e RELEASE_TESTS_REQUIRED=1 \
            ok-service-backend-test \
            pytest tests/test_release_automation.py -v -rs --disable-warnings

          docker run \
            --rm \
            --env-file .env.test \
            ok-service-backend-test \
            pytest --maxfail=3 --disable-warnings --ignore=tests/test_release_automation.py

      - name: Build and Push prod image
        if: github.ref_name != 'master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: prod
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Build and push production candidate (master)
        id: candidate
        if: steps.release.outputs.state == 'new'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: prod
          # A plain manifest keeps one digest from build to deploy and makes labels readable.
          provenance: false
          # Own tag: dev/stage push <SHA>, and this build of the same commit carries a different APP_VERSION.
          tags: ${{ env.IMAGE_NAME }}:master-${{ github.sha }}
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Tag candidate digest with the release version (master)
        if: steps.release.outputs.state == 'new'
        run: bash scripts/release-ci.sh promote "$IMAGE_NAME" "${{ steps.release.outputs.version }}" "${{ steps.candidate.outputs.digest }}"

      - name: Clean up VAPID keys
        run: rm -f vapid_*.pem

      - name: Clean up .env.test
        run: rm -f .env.test



  deploy:
    runs-on: ubuntu-latest
    needs: build-test-push
    if: github.ref_name != 'master' || needs.build-test-push.outputs.state == 'new' || needs.build-test-push.outputs.state == 'resume'
    outputs:
      deployed: ${{ steps.production.outputs.deployed }}
    concurrency:
      group: ${{ github.ref_name == 'dev' && 'ok-service-deploy-dev' || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: ${{ github.ref_name == 'master' && '0' || '1' }}

      - name: Log in to Docker Hub (master)
        if: github.ref_name == 'master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retries: production changes only if this commit is still on master, still unreleased, no newer
      # release exists, and the version and digest are what the build verified. A master that moved
      # ahead after promotion is fine: the newer run then releases on top of this version.
      - name: Recheck remote revision and release state (master)
        id: recheck
        if: github.ref_name == 'master'
        run: |
          bash scripts/release-ci.sh select "$IMAGE_NAME" "$GITHUB_SHA" > recheck.env
          state="$(sed -n 's/^state=//p' recheck.env)"
          case "$state" in
            released) echo "Recheck: already released; not deploying."; echo "go=false" >> "$GITHUB_OUTPUT" ;;
            resume)
              [ "$(sed -n 's/^version=//p' recheck.env)" = "${{ needs.build-test-push.outputs.version }}" ] \
                && [ "$(sed -n 's/^digest=//p' recheck.env)" = "${{ needs.build-test-push.outputs.digest }}" ] \
                || { echo "Release state changed since the build:"; cat recheck.env; exit 1; }
              echo "go=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected release state '${state}'"; exit 1 ;;
          esac

      - name: Setup SSH
        if: github.ref_name != 'master' || steps.recheck.outputs.go == 'true'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ github.ref_name == 'master' && secrets.SSH_PRIVATE_KEY_MASTER || github.ref_name == 'dev' && secrets.SSH_PRIVATE_KEY_DEV || secrets.SSH_PRIVATE_KEY_STAGE }}

      - name: Set env vars per branch
        if: github.ref_name != 'master' || steps.recheck.outputs.go == 'true'
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "DEPLOY_PATH=apps/ok-service-backend" >> $GITHUB_ENV
            echo "SERVER_IP=${{ secrets.SERVER_IP_MASTER }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.SSH_USER_MASTER }}" >> $GITHUB_ENV
            echo "COMPOSE_FILES=-f docker-compose.app.yaml -f docker-compose.prod.yaml" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_PATH=/opt/apps/ok-service-backend-dev" >> $GITHUB_ENV
            echo "SERVER_IP=${{ secrets.SERVER_IP_DEV }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.SSH_USER_DEV }}" >> $GITHUB_ENV
            echo "COMPOSE_FILES=-f docker-compose.app.yaml" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/opt/apps/ok-service-backend-stage" >> $GITHUB_ENV
            echo "SERVER_IP=${{ secrets.SERVER_IP_STAGE }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.SSH_USER_STAGE }}" >> $GITHUB_ENV
            echo "COMPOSE_FILES=-f docker-compose.app.yaml" >> $GITHUB_ENV
          fi
          echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to server (pull + update env)
        if: github.ref_name != 'master'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            cd $DEPLOY_PATH
            echo "Ветка: ${GITHUB_REF##*/}"

            git pull origin ${GITHUB_REF##*/}
            if [ "${GITHUB_REF##*/}" = "dev" ] && [ "\$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "Dev checkout does not match the image commit; aborting deployment." >&2
              exit 1
            fi
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ok-service-backend:${{ github.sha }}

            if [ ! -f .env ]; then touch .env; fi
            grep -q "^TAG=" .env && sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env || echo "TAG=${{ github.sha }}" >> .env
          EOF


      - name: Run Alembic migrations (via exec)
        if: github.ref_name != 'master'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            cd $DEPLOY_PATH
            docker compose $COMPOSE_FILES pull web
            docker compose $COMPOSE_FILES run --rm web alembic upgrade head
          EOF


      - name: Restart backend container
        if: github.ref_name != 'master'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            cd $DEPLOY_PATH
            docker compose $COMPOSE_FILES up -d --force-recreate web
            docker image prune -f > /dev/null
          EOF

      - name: Deploy push worker (dev only)
        if: github.ref_name == 'dev'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            cd $DEPLOY_PATH
            bash scripts/deploy-push-worker.sh
          EOF

      - name: Rebuild Redis statistics
        if: github.ref_name != 'master'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            cd $DEPLOY_PATH
            docker compose $COMPOSE_FILES run --rm web \
              flask --app app:create_app rebuild-project-work-statistics
            docker compose $COMPOSE_FILES run --rm web \
              flask --app app:create_app rebuild-project-material-statistics
          EOF

      # Same sequence as dev/stage (Alembic, web restart, both statistics rebuilds) plus checkout,
      # image identity and readiness checks; the server script runs from this commit.
      - name: Deploy production release (master)
        id: production
        if: github.ref_name == 'master' && steps.recheck.outputs.go == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP <<EOF
            set -e
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          EOF
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP \
            "cd $DEPLOY_PATH && bash -s -- $GITHUB_SHA $IMAGE_NAME ${{ needs.build-test-push.outputs.version }} ${{ needs.build-test-push.outputs.digest }} $GITHUB_RUN_ID" \
            < scripts/deploy-production.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"


  # Only after a verified deployment of this run, or to finish a release whose tag already exists.
  publish:
    runs-on: ubuntu-latest
    needs: [build-test-push, deploy]
    if: >-
      always() && github.ref_name == 'master' && needs.build-test-push.result == 'success' &&
      (needs.build-test-push.outputs.state == 'released' ||
       (needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'))
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release-ci.sh publish "$IMAGE_NAME" \
            "${{ needs.build-test-push.outputs.version }}" "${{ needs.build-test-push.outputs.digest }}" "$GITHUB_SHA"


  notify:
    name: 📬 Notifications
    runs-on: ubuntu-latest
    needs: [build-test-push, deploy, publish]
    if: always()

    steps:
      - name: Checkout (for commit message fallback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install jq (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y jq >/dev/null
          fi

      - name: 📬 Telegram + Jira/OpenProject comments
        continue-on-error: true
        env:
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

          # Jira
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}              
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          # OpenProject
          OPENPROJECT_URL: ${{ secrets.OPENPROJECT_URL }}
          OPENPROJECT_API_TOKEN: ${{ secrets.OPENPROJECT_API_TOKEN }}

        run: |
          set -euo pipefail

          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          REPO_URL="https://github.com/${REPO}"

          BUILD_STATUS="${{ needs.build-test-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          PUBLISH_STATUS="${{ needs.publish.result }}"
          RELEASE_STATE="${{ needs.build-test-push.outputs.state }}"
          VERSION="${{ needs.build-test-push.outputs.version }}"
          DEPLOYED="${{ needs.deploy.outputs.deployed }}"

          # OUTCOME: failed | skipped | unpublished | released | success (dev/stage)
          if [ "${REF_NAME}" != "master" ]; then
            [ "${DEPLOY_STATUS}" = "success" ] && OUTCOME=success || OUTCOME=failed
          elif [ "${BUILD_STATUS}" != "success" ] || { [ "${DEPLOY_STATUS}" != "success" ] && [ "${DEPLOY_STATUS}" != "skipped" ]; }; then
            OUTCOME=failed
          elif [ "${PUBLISH_STATUS}" = "success" ]; then
            OUTCOME=released
          elif [ "${DEPLOYED}" = "true" ] || [ "${RELEASE_STATE}" = "released" ]; then
            OUTCOME=unpublished
          else
            OUTCOME=skipped
          fi

          # --- Commit message / author (с фолбэком, чтобы не зависеть от github.event.head_commit.*)
          COMMIT_MESSAGE="$(git log -1 --pretty=%B || true)"
          AUTHOR_NAME="$(git log -1 --pretty=%an || true)"
          AUTHOR_LOGIN="${{ github.actor }}"

          # --- HTML escape для Telegram
          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          SAFE_MSG="$(html_escape "${COMMIT_MESSAGE}")"
          SAFE_AUTHOR="$(html_escape "${AUTHOR_NAME:-$AUTHOR_LOGIN}")"

          # --- ENV name по ветке
          case "${REF_NAME}" in
            dev)    ENV_NAME="dev" ;;
            stage)  ENV_NAME="stage" ;;
            master) ENV_NAME="prod" ;;
            *)      ENV_NAME="${REF_NAME}" ;;
          esac

          # --- Extract Jira keys + OP ids
          extract_jira_keys() {
            printf '%s\n' "${COMMIT_MESSAGE}" \
              | grep -oiE '\b[A-Z][A-Z0-9]+-[0-9]+\b' \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          extract_op_ids() {
            printf '%s\n' "${COMMIT_MESSAGE}" \
              | grep -oE 'OP#[0-9]+' \
              | sed 's/OP#//g' \
              | sort -u
          }

          JIRA_KEYS="$(extract_jira_keys || true)"
          OP_IDS="$(extract_op_ids || true)"

          # --- 1) Telegram text
          EXTRA_LINK=""
          CACHE_STATUS="✅ <b>Прогрев Redis-кэша:</b> работы и материалы"
          case "${OUTCOME}" in
            failed)
              HEAD="🛑 <b>Ошибка деплоя</b>"
              CACHE_STATUS="⚠️ <b>Прогрев Redis-кэша:</b> не подтверждён"
              EXTRA_LINK="\n\n<a href=\"${RUN_URL}\">🔍 Открыть GitHub Actions</a>"
              COMMENT="Deployment to ${ENV_NAME} failed: ${RUN_URL}" ;;
            skipped)
              # Deploy job succeeded without deploying: the recheck found the commit already released.
              [ "${DEPLOY_STATUS}" = "success" ] && RELEASE_STATE="released"
              HEAD="ℹ️ <b>Деплой не требуется</b> (${RELEASE_STATE:-skip}): production не менялся"
              CACHE_STATUS="ℹ️ <b>Прогрев Redis-кэша:</b> не выполнялся" ;;
            unpublished)
              HEAD="⚠️ Деплой <b>v${VERSION}</b> подтверждён, <b>релиз не опубликован</b> (Re-run publish)"
              EXTRA_LINK="\n\n<a href=\"${RUN_URL}\">🔍 Открыть GitHub Actions</a>"
              COMMENT="Deployed v${VERSION} to ${ENV_NAME}; GitHub Release publication failed: ${RUN_URL}" ;;
            released)
              HEAD="✅ Релиз <b>v${VERSION}</b> выпущен: деплой подтверждён, GitHub Release опубликован"
              [ "${DEPLOYED}" = "true" ] || CACHE_STATUS="ℹ️ <b>Прогрев Redis-кэша:</b> выполнен при деплое релиза"
              COMMENT="Released v${VERSION} to ${ENV_NAME}: ${REPO_URL}/releases/tag/v${VERSION} (run ${RUN_URL})" ;;
            *)
              HEAD="✅ Деплой <b>успешен</b>"
              COMMENT="Deployed to ${ENV_NAME} via GitHub Actions run ${RUN_URL}" ;;
          esac

          TASKS_BLOCK=""
          if [ -n "${JIRA_KEYS:-}" ] || [ -n "${OP_IDS:-}" ]; then
            TASKS_BLOCK="📌 <b>Задачи:</b>"

            if [ -n "${JIRA_KEYS:-}" ]; then
              TASKS_BLOCK="${TASKS_BLOCK}
              <b>Jira:</b>"
              for KEY in ${JIRA_KEYS}; do
                if [ -n "${JIRA_URL:-}" ]; then
                  URL="${JIRA_URL%/}/browse/${KEY}"
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • <a href=\"${URL}\">${KEY}</a>"
                else
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • ${KEY}"
                fi
              done
            fi

            if [ -n "${OP_IDS:-}" ]; then
              TASKS_BLOCK="${TASKS_BLOCK}
              <b>OpenProject:</b>"
              for ID in ${OP_IDS}; do
                if [ -n "${OPENPROJECT_URL:-}" ]; then
                  URL="${OPENPROJECT_URL%/}/work_packages/${ID}"
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • <a href=\"${URL}\">OP#${ID}</a>"
                else
                  TASKS_BLOCK="${TASKS_BLOCK}
                  • OP#${ID}"
                fi
              done
            fi
          else
            TASKS_BLOCK="📌 <b>Задачи:</b> нет (не найдено ни OP#123, ни ABC-123)"
          fi

          TEXT="$(cat <<EOF
          ${HEAD}

          🧩 <b>Env:</b> <code>${ENV_NAME}</code>
          📦 <b>Ветка:</b> <code>${REF_NAME}</code>
          🔖 <b>Коммит:</b> <code>${SHORT_SHA}</code>${VERSION:+
          🏷 <b>Версия:</b> <code>${VERSION}</code>}
          👤 <b>Автор:</b> <a href="https://github.com/${AUTHOR_LOGIN}">${SAFE_AUTHOR}</a>
          ${CACHE_STATUS}

          📝 <b>Сообщение:</b>
          <code>${SAFE_MSG}</code>

          ${TASKS_BLOCK}

          <a href="${RUN_URL}">🔗 Открыть GitHub Actions</a>
          <a href="${REPO_URL}">📦 Репозиторий</a>${EXTRA_LINK}
          EOF
          )"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              ${TELEGRAM_THREAD_ID:+-d message_thread_id="${TELEGRAM_THREAD_ID}"} \
              -d parse_mode=HTML \
              -d disable_web_page_preview=true \
              --data-urlencode "text=${TEXT}" >/dev/null || true
          else
            echo "Telegram creds missing, skip"
          fi

          # --- 2) Jira comments
          if [ "${OUTCOME}" = "skipped" ]; then
            echo "Deployment skipped, no Jira comments"
          elif [ -n "${JIRA_URL:-}" ] && [ -n "${JIRA_USER:-}" ] && [ -n "${JIRA_API_TOKEN:-}" ] && [ -n "${JIRA_KEYS:-}" ]; then
            PAYLOAD="$(jq -n --arg body "$COMMENT" '{body:$body}')"

            for KEY in ${JIRA_KEYS}; do
              echo "Post comment to Jira ${KEY}"

              # Cloud обычно api/3, но сделаем фолбэк на api/2
              code="$(curl -s -o /tmp/jira_out -w "%{http_code}" \
                -u "${JIRA_USER}:${JIRA_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -X POST "${JIRA_URL%/}/rest/api/3/issue/${KEY}/comment" \
                -d "${PAYLOAD}" || true)"

              if [ "$code" = "404" ] || [ "$code" = "400" ]; then
                code2="$(curl -s -o /tmp/jira_out2 -w "%{http_code}" \
                  -u "${JIRA_USER}:${JIRA_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X POST "${JIRA_URL%/}/rest/api/2/issue/${KEY}/comment" \
                  -d "${PAYLOAD}" || true)"
                [ "$code2" -ge 200 ] && [ "$code2" -lt 300 ] || echo "Jira comment failed for ${KEY} (http ${code2})"
              else
                [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || echo "Jira comment failed for ${KEY} (http ${code})"
              fi
            done
          else
            echo "Jira creds or keys missing, skip Jira comments"
          fi

          # --- 3) OpenProject comments (как у тебя было)
          if [ "${OUTCOME}" = "skipped" ]; then
            echo "Deployment skipped, no OpenProject comments"
          elif [ -n "${OPENPROJECT_URL:-}" ] && [ -n "${OPENPROJECT_API_TOKEN:-}" ] && [ -n "${OP_IDS:-}" ]; then
            for ID in ${OP_IDS}; do
              echo "Post comment to OpenProject OP#${ID}"
              curl -sS -X POST \
                -u "apikey:${OPENPROJECT_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${OPENPROJECT_URL%/}/api/v3/work_packages/${ID}/activities" \
                -d "$(jq -n --arg c "$COMMENT" '{comment:{raw:$c}}')" \
                >/dev/null || echo "OpenProject comment failed for OP#${ID}"
            done
          else
            echo "OpenProject creds or ids missing, skip OpenProject comments"
          fi
