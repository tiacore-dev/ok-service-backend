services:
  redis:
    image: redis:7
    restart: unless-stopped
    container_name: ok-service-backend-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      ok_network:
        aliases:
          - ok-redis

volumes:
  redis_data:

networks:
  ok_network:
    external: true
