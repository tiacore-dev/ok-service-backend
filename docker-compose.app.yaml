services:
  web:
    image: ${DOCKERHUB_USERNAME}/ok-service-backend:${TAG}
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "${FLASK_PORT}:8000"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
    volumes:
      - ./logs:/app/logs
      - .env:/app/.env
    command: gunicorn -c gunicorn.conf.py run:app
    networks:
      - ok_network

  template-service:
    image: ${TEMPLATE_SERVICE_CI_REGISTRY_IMAGE}/template-service:${TEMPLATE_SERVICE_TAG}  
    container_name: template-service
    tty: true
    stdin_open: true
    restart: always
    volumes:
      - ./logs:/app/logs  
      - .env:/app/.env 
    networks:
      - ok_network

networks:
  ok_network:
    external: true
